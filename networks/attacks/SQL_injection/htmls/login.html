
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #312e81, #6d28d9);
            overflow: hidden;
        }

        /* Background glowing circles */
        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.6;
        }

        body::before {
            background: #8b5cf6;
            top: -80px;
            left: -80px;
        }

        body::after {
            background: #06b6d4;
            bottom: -80px;
            right: -80px;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 380px;
            padding: 45px 35px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            animation: appear 0.8s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #cbd5e1;
            text-align: center;
            margin-bottom: 35px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            color: #e2e8f0;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            outline: none;
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }

        input::placeholder {
            color: #cbd5e1;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 12px rgba(167, 139, 250, 0.4);
        }

        input[type="submit"] {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        input[type="submit"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.5);
        }

        input[type="submit"]:active {
            transform: scale(0.98);
        }

        .footer {
            text-align: center;
            color: #cbd5e1;
            font-size: 12px;
            margin-top: 25px;
        }

        @media (max-width: 450px) {
            .login-container {
                width: 90%;
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h1>Welcome Back</h1>
        <p class="subtitle">Please login to your account</p>

        <form action="/login" method="post">

            <div class="input-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <input type="submit" value="Sign In">

        </form>

        <div class="footer">
            © 2026 Your Website. All rights reserved.
        </div>
    </div>

</body>
</html>

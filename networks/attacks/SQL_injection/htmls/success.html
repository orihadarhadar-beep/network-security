
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Successful</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #052e16, #064e3b, #0f172a);
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 420px;
            padding: 50px 35px;
            text-align: center;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: appear 0.7s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .check {
            width: 100px;
            height: 100px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #22c55e;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 55px;
            box-shadow: 0 0 35px rgba(34,197,94,0.5);
            animation: pop 0.6s ease;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        h1 {
            color: white;
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            color: #bbf7d0;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            padding: 14px 35px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(34,197,94,0.4);
        }

        .footer {
            margin-top: 30px;
            color: #86efac;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="check">✓</div>

        <h1>Login Successful!</h1>

        <p>
            Congratulations! You have successfully logged in.
            Welcome to your account.
        </p>

        <a href="/">Continue</a>

        <div class="footer">
            © 2026 Your Website
        </div>

    </div>

</body>
</html>
